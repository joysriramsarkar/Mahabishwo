services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cosmos
      POSTGRES_USER: cosmos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../scientific-knowledge/schema/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos -d cosmos"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: cosmos/deploy/Dockerfile.api
    environment:
      COSMOS_DATABASE_URL: postgresql://cosmos:${POSTGRES_PASSWORD:-change-me}@postgres:5432/cosmos
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
