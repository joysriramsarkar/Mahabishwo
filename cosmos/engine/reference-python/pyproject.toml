[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-engine"
version = "0.1.0"
description = "COSMOS reference cosmology / IC / PM / light-cone engine (educational reference implementation; production solver is C++20/CUDA per masterplan s14.2)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "astropy>=6.0,<9",
  "pyarrow>=14,<27",
]

[project.optional-dependencies]
healpix = ["healpy>=1.16"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "duckdb>=0.10", "pydantic>=2"]
dev = ["pytest>=8", "httpx>=0.27", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
