name: COSMOS CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cosmos
          POSTGRES_DB: cosmos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine + API deps
        run: |
          pip install -e "cosmos/engine/reference-python[api,dev]" pglast
      - name: Coverage verifier (masterplan source preservation)
        run: python COSMOS-Masterplan/tools/coverage_verifier.py
      - name: Ingest gate (no source/uncertainty/license = no entry)
        run: python cosmos/scientific-knowledge/ingest/validate_catalog.py
      - name: Pipeline checks
        run: python cosmos/validation/pipeline/checks.py
      - name: PostgreSQL migration (18 tables)
        env:
          PGPASSWORD: cosmos
        run: |
          psql -h localhost -U postgres -d cosmos -v ON_ERROR_STOP=1 \
            -f cosmos/scientific-knowledge/schema/001_initial.sql
          psql -h localhost -U postgres -d cosmos -c "\dt" | grep -c "table"
      - name: pytest (engine, API, schema, pipeline, acceptance)
        run: python -m pytest cosmos/tests -q

  explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cosmos/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cosmos/explorer/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Playwright e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  root-l0-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Root Local-Scope L0 app build
        run: npm run build
